# interstellard configuration. All keys are optional; unknown keys are
# rejected at startup.

# HTTP address of the streamable MCP endpoint. Keep it on loopback unless
# you put authentication in front of the gateway.
listen: "127.0.0.1:8420"

# Directory scanned for wormhole plugin executables at startup.
wormhole_dir: "/var/lib/interstellar/wormholes"

# Append-only JSONL log of every tool call (allowed and denied).
audit_log: "/var/lib/interstellar/audit.jsonl"

# Targets are named endpoints a tool can be pointed at. Each binds a
# wormhole's provided port to configuration the agent never sees. A tool that
# requires a port gets a "<port>_target" argument whose choices are the
# targets of a matching type. Targets are kept warm between calls and torn
# down after idle_timeout.
targets:
  # The gateway host itself, via the local-exec wormhole.
  localhost:
    wormhole: local-exec
    port: host

  # A machine reached over SSH. With this configured, a tool requiring an
  # exec-endpoint can be routed to "build-box".
  build-box:
    wormhole: ssh
    port: target
    idle_timeout: 5m
    config:
      host: build.internal
      user: builder
      key_file: /etc/interstellar/keys/builder
      known_hosts_file: /etc/interstellar/known_hosts
      # Auth can also be a password (prefer password_env over inline) or the
      # SSH agent (use_agent: true, for smartcard/security keys).
    # Route the SSH connection through a tunnel by naming a network-context
    # target for ssh's required "net" port. Drop `via` for a direct
    # connection (ssh's net port is optional).
    # via:
    #   net: corp-vpn

  # A WireGuard tunnel providing a network-context other targets route
  # through. Userspace (no root, no kernel interface); config_file is a
  # standard wg-quick file. The wireguard wormhole is built from the separate
  # `wormholes` repo.
  corp-vpn:
    wormhole: wireguard
    port: tunnel
    idle_timeout: 10m
    config:
      config_file: /etc/interstellar/wg/corp.conf

  # A Tailscale tailnet as a network-context. Embeds a userspace node via
  # tsnet; the auth key is read from the environment, not stored here. The
  # tailscale wormhole is built from the separate `wormholes` repo (its
  # binary just needs to be in --wormhole-dir).
  # tailnet:
  #   wormhole: tailscale
  #   port: tailnet
  #   config:
  #     hostname: interstellar-gw
  #     authkey_env: TS_AUTHKEY

  # A third-party MCP server held by the mcp-stdio provider and offered as an
  # mcp-endpoint. A purpose-built consumer wormhole (e.g. mcp-client-greeter, a
  # reference example in the separate wormholes repo) requires this port and
  # exposes only its own curated tools; the upstream server's
  # raw tools are never shown to the agent. The upstream's own credentials are
  # supplied as ambient environment to interstellard and inherited by the
  # spawned subprocess — keep them out of this file.
  # greeter-backend:
  #   wormhole: mcp-stdio
  #   port: server
  #   config:
  #     command: mcp-greeter
  #     args: []
  #     # env adds/overrides variables for the subprocess on top of the
  #     # inherited environment.
  #     # env:
  #     #   SOME_FLAG: "1"

policy:
  # Capability classes denied for every wormhole unless re-allowed below.
  # Omit this key for the default ["exec.arbitrary"]; an explicit empty
  # list denies nothing. Valid classes: read, write, network, exec.scoped,
  # exec.arbitrary. A typo here fails at startup.
  deny_capabilities: [exec.arbitrary]

  # Optional: an external policy engine for semantic (content-aware) checks.
  # Omit this block to disable semantic_checks entirely; configuring a check
  # below without this block is a startup error. When present, each matching
  # tool call is sent to the engine at call time.
  #
  # DATA EGRESS: a matching call's wormhole name, tool name, and arguments
  # (target routing stripped) leave the gateway for `base_url`. Keep checks
  # scoped to the tools that need them, and point `base_url` at a self-hosted
  # or proxy endpoint if arguments must not reach a third party.
  # engine:
  #   type: jev                     # default "jev"; only value supported today
  #   api_key_env: TYPESAFE_API_KEY # preferred over inline api_key
  #   # api_key: "sk-..."           # inline fallback
  #   base_url: https://api.typesafe.ai  # default; override for self-host/proxy
  #   model: jev-latest             # default
  #   timeout: 5s                   # per-call; exceeding it fails closed (deny)

  # Semantic checks run only AFTER capability policy already allowed the call,
  # so they can only deny further, never re-grant. Each entry attaches
  # natural-language `deny_rules` to a set of tools; if the engine judges a
  # call matches any rule with probability >= deny_threshold (default 0.5),
  # the call is denied. Any engine error or timeout also denies (fail closed).
  # These top-level checks apply to every tool of every wormhole.
  # semantic_checks:
  #   - deny_rules:
  #       - "The call deletes, drops, or destroys data."
  #       - "The call exfiltrates secrets, credentials, or customer PII."
  #     # tools omitted => every tool
  #     deny_threshold: 0.5

  wormholes: {}
    # Example: trust one wormhole with caller-supplied commands, block some of
    # its tools entirely, and attach a per-wormhole semantic check.
    # some-shell:
    #   allow_capabilities: [exec.arbitrary]
    #   deny_tools: ["*_destructive"]
    # mattermost:
    #   semantic_checks:
    #     - tools: ["post_*", "update_*"]   # globs; omitted => every tool
    #       deny_rules:
    #         - "The message contains credentials, API keys, or customer PII."
    #       deny_threshold: 0.6
